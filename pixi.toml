# Pixi environment for the AEO workshop notebooks.
# Keep in sync with environment.yml.
#
#   pixi install
#   pixi run lab
[workspace]
name = "aeo-workshop"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]
lab = "jupyter lab"
notebook = "jupyter notebook"
# One-off per clone: register nbstripout as a git filter (strips outputs on
# `git add`) and turn on .githooks/pre-commit (refuses commits with outputs)
setup-git = "nbstripout --install --attributes .gitattributes && git config core.hooksPath .githooks"

[dependencies]
python = "3.12.*"
# Core raster and array handling
rasterio = ">=1.3.0"
rioxarray = ">=0.15"
xarray = ">=2024.1.0"
numpy = ">=1.26.0"
scipy = ">=1.11"
pyproj = ">=3.6.0"
# Reads the imagery from the workshop STAC catalogue
pystac = ">=1.10"
# LiDAR point clouds (LAS/LAZ/COPC) for Chapter 5; requests fetches over HTTP
laspy = ">=2.5"
lazrs-python = ">=0.6"
requests = ">=2.31"
# Visualisation
plotly = ">=5.20.0"
folium = ">=0.15.0"
matplotlib = ">=3.8.0"
# Tabular data
pandas = ">=2.2.0"
# Jupyter
jupyterlab = ">=4.2.0"
notebook = ">=7.2.0"
ipywidgets = ">=8.1.0"
anywidget = ">=0.9"  # needed by plotly FigureWidget (Chapter 3)
nbformat = ">=5.10.0"
# Strips notebook outputs on commit (see README)
nbstripout = "*"
