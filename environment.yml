# Conda / mamba environment for the AEO workshop notebooks.
# Keep in sync with the [dependencies] table in pixi.toml.
#
#   mamba env create -f environment.yml
#   mamba activate aeo-workshop
name: aeo-workshop
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Core raster and array handling
  - rasterio>=1.3.0
  - rioxarray>=0.15
  - xarray>=2024.1.0
  - numpy>=1.26.0
  - scipy>=1.11
  - pyproj>=3.6.0
  # Parallel / out-of-core processing (bokeh powers the dask dashboard)
  - dask>=2024.1.0
  - distributed>=2024.1.0
  - bokeh>=3.1
  # Visualisation
  - plotly>=5.20.0
  - folium>=0.15.0
  - matplotlib>=3.8.0
  # Tabular data
  - pandas>=2.2.0
  # Jupyter
  - jupyterlab>=4.2.0
  - notebook>=7.2.0
  - ipywidgets>=8.1.0
  - anywidget>=0.9  # needed by plotly FigureWidget (Chapter 3)
  - nbformat>=5.10.0
  # Strips notebook outputs on commit (see README)
  - nbstripout
